services:
  - type: web
    name: argus-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: PORT
        value: 4000
      - key: REPOS_DIR
        value: ./repos
      - key: OPENAI_API_KEY
        sync: false
