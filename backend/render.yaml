services:
  - type: web
    name: argus-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    port: 4000
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: argus-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: argus-redis
          property: connectionString
      - key: PORT
        value: 4000
      - key: REPOS_DIR
        value: ./repos
      - key: OPENAI_API_KEY
        sync: false

  - type: pserv
    name: argus-db
    runtime: postgres15
    ipAllowList: []
    plan: starter
    postgresVersion: 15
    initialDatabaseName: argus
    user: postgres
    region: oregon

  - type: redis
    name: argus-redis
    plan: starter
    region: oregon

databases:
  - name: argus-db
    database: argus
    user: postgres
