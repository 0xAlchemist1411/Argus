services:
  - type: web
    name: argus-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: argus-db
          property: connectionString
      - key: REDIS_URL
        value: redis://redis:6379
      - key: PORT
        value: 4000
      - key: REPOS_DIR
        value: ./repos
      - key: OPENAI_API_KEY
        sync: false

  - type: pserv
    name: argus-db
    ipAllowList: []
    plan: starter
    region: oregon

  - type: redis
    name: argus-redis
    plan: starter
    region: oregon
